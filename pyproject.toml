[project]
name = "glucose-neuralforecast"
version = "0.1.2"
description = "Library to train and evaluate neural forecast models for glucose prediction"
readme = "README.md"
authors = [
    { name = "antonkulaga", email = "antonkulaga@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "eliot>=1.17.5",
    "fastexcel>=0.16.0",
    "fsspec>=2025.9.0",
    "kaleido>=0.2.1",
    "matplotlib>=3.10.7",
    "neuralforecast>=3.1.2",
    "plotly>=6.3.1",
    "polars>=1.34.0",
    "pyarrow>=22.0.0",
    "pycomfort>=0.0.18",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "typer>=0.20.0",
    "utilsforecast>=0.2.14",
]

[project.scripts]
train = "glucose_neuralforecast.train:app"
predict = "glucose_neuralforecast.inference:app"
summarize = "glucose_neuralforecast.summarize:app"
glucoseml = "glucose_neuralforecast.glucoseml.cli:app"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.4.9",
]

[tool.uv]
# Use ray 2.9.3 which is the last version with Windows wheels
# This requires compatible versions of pyarrow, numpy, and setuptools
override-dependencies = [
    "ray==2.9.3",
    "pyarrow==14.0.1",
    "numpy<2",
    "setuptools==69.0.3"
]
